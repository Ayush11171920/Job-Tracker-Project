{% extends "base.html" %}
{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 p-6">

    <div class="bg-white/90 backdrop-blur-lg shadow-2xl rounded-2xl w-full max-w-md p-8 animate-fade-in">

        <!-- Heading -->
        <h2 class="text-3xl font-bold text-gray-800 text-center">
            Welcome Back 👋
        </h2>

        <p class="text-sm text-gray-600 text-center mt-2 mb-6">
            Track your job applications efficiently and stay organized.
        </p>

        <!-- Error Message -->
        {% if error %}
        <div class="flex items-center bg-red-100 text-red-700 px-4 py-2 rounded-lg mb-4 text-sm">
            <span class="mr-2">⚠️</span>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <!-- Username -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Username
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        👤
                    </span>
                    <input
                        type="text"
                        name="username"
                        required
                        placeholder="Enter your username"
                        class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
                    >
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Password
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        🔒
                    </span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="Enter your password"
                        class="w-full pl-10 pr-10 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
                    >

                    <!-- Show/Hide Button -->
                    <span onclick="togglePassword()" 
                          class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer text-gray-500">
                        👁️
                    </span>
                </div>
            </div>

            <!-- Remember + Forgot -->
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center">
                    <input type="checkbox" class="mr-2">
                    Remember me
                </label>
                <span class="text-indigo-600 hover:underline cursor-pointer">
                    Forgot password?
                </span>
            </div>

            <!-- Button -->
            <button
                type="submit"
                class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200"
            >
                Login
            </button>

        </form>

        <!-- Footer -->
        <p class="text-center text-xs text-gray-500 mt-6">
            © 2026 JobTracker | Built with Django
        </p>

    </div>

</div>

<!-- JS for Password Toggle -->
<script>
function togglePassword() {
    const password = document.getElementById("password");
    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}
</script>

<style>
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
.animate-fade-in {
    animation: fadeIn 0.4s ease-out;
}
</style>

{% endblock %}
