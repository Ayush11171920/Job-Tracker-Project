{% extends "base.html" %}
{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-500 to-purple-600">
    
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
        
        <h2 class="text-2xl font-bold text-center mb-2">Create Account ✨</h2>
        <p class="text-gray-500 text-center mb-6">Start tracking your job applications</p>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-2 rounded text-sm 
                    {% if message.tags == 'error' %} bg-red-100 text-red-700 
                    {% else %} bg-green-100 text-green-700 {% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-sm mb-1">Username</label>
                <input type="text" name="username" placeholder="Enter username"
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <div class="mb-4">
                <label class="block text-sm mb-1">Password</label>
                <input type="password" name="password" placeholder="Enter password"
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                Signup
            </button>
        </form>

        <p class="text-center text-sm mt-4">
            Already have an account?
            <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Login</a>
        </p>

    </div>

</div>

{% endblock %}
